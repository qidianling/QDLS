name: release

on:
  push:
    tags:
      - "v*"

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Pack
        run: |
          sudo apt-get update -qq && sudo apt-get install -y -qq zip
          zip -r QDLS.zip . -x ".git/*" -x ".github/*" -x "QDLS.zip"

      - name: Publish
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          if gh release view "$GITHUB_REF_NAME" >/dev/null 2>&1; then
            gh release upload "$GITHUB_REF_NAME" QDLS.zip --clobber
          else
            gh release create "$GITHUB_REF_NAME" QDLS.zip \
              --title "QDLS $GITHUB_REF_NAME" \
              --notes-file RELEASE.md
          fi
