<!doctype html>
<html lang="zh"><head><meta charset="utf-8"><title>QDLS 插件预览（DSH）</title>
<style>
:root{--bg:#f5f7fb;--card:#fff;--line:#e8ecf5;--tx:#1f2733;--dim:#7a8699;--accent:#4f7cff;--soft:#eaf0ff;--ok:#22c55e}
*{box-sizing:border-box}
body{margin:0;padding:36px;background:var(--bg);color:var(--tx);font:14px/1.6 -apple-system,"Segoe UI","Microsoft YaHei",sans-serif}
.wrap{max-width:760px;margin:0 auto}
h1{font-size:18px;margin:0 0 4px}
.sub{color:var(--dim);font-size:12.5px;margin-bottom:22px}
.card{background:var(--card);border:1px solid var(--line);border-radius:14px;padding:18px 20px;box-shadow:0 1px 2px rgba(16,24,40,.04),0 8px 24px rgba(16,24,40,.06);margin-bottom:16px}
.row{display:flex;gap:14px;align-items:flex-start}
.ico{width:44px;height:44px;flex:0 0 44px;border-radius:12px;background:var(--soft);display:grid;place-items:center}
.ico svg{width:32px;height:32px}
.name{font-size:15px;font-weight:600}
.desc{color:var(--dim);font-size:12.5px;margin-top:2px}
.pill{display:inline-block;font-size:11px;padding:2px 8px;border-radius:99px;background:var(--soft);color:var(--accent);margin-left:8px;vertical-align:2px}
.badge{font-size:11px;padding:2px 8px;border-radius:99px;background:#e8f8ee;color:#12805c}
label{display:flex;flex-direction:column;gap:5px;font-size:12px;color:var(--dim);margin-top:14px}
input{font:inherit;font-size:13px;padding:9px 11px;border:1px solid var(--line);border-radius:9px;background:#fff;color:var(--tx)}
input:focus{outline:none;border-color:var(--accent)}
.two{display:grid;grid-template-columns:1fr 1fr;gap:12px}
.hint{color:var(--dim);font-size:12px;margin-top:10px}
.tools{display:flex;gap:8px;flex-wrap:wrap;margin-top:8px}
.tool{font:12px ui-monospace,Consolas,monospace;background:#0d1117;color:#c9d1d9;padding:3px 8px;border-radius:6px}
</style></head><body><div class="wrap">
<h1>DSH 插件预览</h1>
<div class="sub">这是安装后在「插件管理」里会看到的样子（示意，不是真实页面）</div>

<div class="card">
  <div class="row">
    <div class="ico">
      <svg viewBox="0 0 64 64"><rect width="64" height="64" rx="14" fill="#245cff"/>
      <path d="M14 42c0-12 8-20 18-20 8 0 14 5 14 12v10" fill="none" stroke="#fff" stroke-width="5" stroke-linecap="round"/>
      <circle cx="24" cy="38" r="3.2" fill="#fff"/>
      <path d="M34 44V30m7 14V30m7 10V32" stroke="#fff" stroke-width="4.5" stroke-linecap="round"/></svg>
    </div>
    <div style="flex:1">
      <div class="name">QDLS 翻唱引擎<span class="pill">MCP</span></div>
      <div class="desc">把本地 QDLS 引擎接到 Harness：点歌、音色、状态（mcp__qdls__*）。</div>
    </div>
    <span class="badge">已启用</span>
  </div>
  <div class="tools">
    <span class="tool">mcp__qdls__qdls_sing</span>
    <span class="tool">mcp__qdls__qdls_voices</span>
    <span class="tool">mcp__qdls__qdls_status</span>
  </div>
</div>

<div class="card">
  <div class="name" style="font-size:13px;margin-bottom:2px">配置</div>
  <div class="desc">装好后可在这里改地址/token，不用重新安装</div>
  <label>QDLS_URL（API 地址）<input value="http://127.0.0.1:6768"></label>
  <label>QDLS_TOKEN<input value="<TOKEN>"></label>
  <div class="two">
    <label>command<input value="<PYTHON>/python.exe"></label>
    <label>args<input value="<QDLS>/qdls_mcp.py"></label>
  </div>
  <div class="hint">这几个字段就是 <code>dsh-bundle/cordis.patch.yml</code> 里的内容，安装后由插件的 Config 表单渲染。</div>
</div>
</div></body></html>
